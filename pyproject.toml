[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cre-regulations-data-extraction"
version = "0.1.0"
description = "Pipelines for ingesting municipal building performance standards regulations and disclosures"
requires-python = ">=3.11"
dependencies = [
    "docling>=2.76",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "einops>=0.7",
    "anthropic>=0.40",
    "tenacity>=9.0",
    "pydantic-settings>=2.5",
    "pyspark==4.0.1",
    "delta-spark==4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["regulation_pipeline", "disclosure_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
